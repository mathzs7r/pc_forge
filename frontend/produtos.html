<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/catalog.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=2">
    <title>PC Forge | Peças e Acessórios de TI</title>
    <meta name="description" content="Catálogo de peças de informática: processadores, placas de vídeo, SSDs, memórias e periféricos de lojas parceiras. Filtre por preço e categoria na PC Forge.">
    <script src="assets/js/acesso.js" data-exige="sessao"></script>
</head>

<body data-tipo-pagina="cliente">
    <div id="topo-montagem" data-tipo="cliente" data-modo="cadastro"></div>

    <section class="hero-vitrine">
        <div class="hero-vitrine-conteudo">
            <div class="hero-vitrine-texto">
                <h1 class="hero-titulo">Peças de alta performance<br><span>montadas sob encomenda.</span></h1>
                <p class="hero-sub">
                    Processadores, placas de vídeo, memória e periféricos direto das lojas
                    parceiras, com frete grátis e avaliação real dos compradores.
                </p>
                <a href="montar.html" class="hero-cta" data-so-cliente hidden>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M4 8V4h4l10 10a2.5 2.5 0 0 1-3.5 3.5L4 8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M15 15l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    Monte seu PC peça por peça
                </a>
            </div>

            <figure class="hero-vitrine-visual" aria-hidden="true">
                <!-- composição geométrica: plca estilizada em grade lime -->
                <svg viewBox="0 0 420 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="330" cy="70" r="120" stroke="var(--accent)" stroke-opacity="0.25" stroke-width="1.5"/>
                    <circle cx="330" cy="70" r="86" stroke="var(--accent)" stroke-opacity="0.4" stroke-width="1.5"/>
                    <circle cx="330" cy="70" r="4" fill="var(--accent)"/>
                    <!-- chip central -->
                    <rect x="70" y="70" width="150" height="150" rx="18" fill="rgba(198,255,61,0.06)" stroke="var(--accent)" stroke-opacity="0.65" stroke-width="1.5"/>
                    <rect x="104" y="104" width="82" height="82" rx="9" stroke="var(--accent)" stroke-width="1.5"/>
                    <path d="M96 70V50M126 70V50M156 70V50M186 70V50M96 220v20M126 220v20M156 220v20M186 220v20M70 96H50M70 126H50M70 156H50M70 186H50M220 96h20M220 126h20M220 156h20M220 186h20" stroke="var(--accent)" stroke-opacity="0.7" stroke-width="1.5"/>
                    <rect x="120" y="120" width="50" height="50" rx="5" fill="rgba(198,255,61,0.16)"/>
                    <!-- linhas supernovas -->
                    <path d="M280 210h120M300 240h80M300 268h56" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="1.5"/>
                    <path d="M40 260c40-60 120-70 190-140" stroke="var(--accent)" stroke-opacity="0.18" stroke-width="1.5"/>
                    <path d="M0 40c80 20 100 60 150 100" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
                </svg>
            </figure>
        </div>
    </section>

    <div class="filtros" id="filtros"></div>

    <main class="secao-produtos">
        <div class="grade-produtos" id="grade-produtos">
            <p class="estado-carregando">Carregando produtos...</p>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/icones.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/demo.js"></script>
    <script src="assets/js/admin-modal.js"></script>
    <script src="assets/js/carrinho-api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/favoritos.js"></script>
    <script src="assets/js/produtos.js"></script>
    <script src="assets/js/animacoes.js"></script>
</body>

</html>

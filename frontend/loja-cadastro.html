<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <title>Cadastrar loja | PC Forge — Peças de TI</title>
</head>

<body data-tipo-pagina="loja">
    <div id="topo-montagem" data-tipo="loja" data-modo="cadastro"></div>

    <div class="tela">
        <section class="vitrine">
            <div class="vitrine-trajeto">
                <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M-50 40 Q 160 0 260 200 T 560 460" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 10" opacity="0.35"/>
                    <circle cx="260" cy="200" r="70" fill="var(--accent)" opacity="0.06"/>
                    <circle cx="500" cy="445" r="9" fill="var(--accent)" opacity="0.5"/>
                </svg>
            </div>
            <span class="vitrine-eyebrow">Painel de vendedor</span>
            <h2 class="vitrine-titulo">BORA<br><em>VENDER.</em></h2>
            <p class="vitrine-texto">Cadastre sua loja e alcance milhares de builders em todo o Brasil. Sem CPF, sem enrolação — só o que uma empresa precisa.</p>
        </section>

        <div class="pagina">
            <main>
                <h1>Cadastre sua loja</h1>
                <p class="subtitulo">Venda peças e acessórios de TI na PC Forge</p>

                <form id="form-cadastro-loja">
                    <label for="nome">Nome da loja</label>
                    <input type="text" id="nome" required>

                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required>

                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade - UF" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="contato@sualoja.com" required>

                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" placeholder="(00) 00000-0000" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" required>

                    <input type="submit" value="Criar conta da loja">

                    <p id="mensagem-erro" class="mensagem-erro"></p>
                </form>
            </main>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/demo.js"></script>
    <script src="assets/js/admin-modal.js"></script>
    <script src="assets/js/carrinho-api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/loja-cadastro.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <title>Criar conta de cliente | PC Forge — Peças de TI</title>
    <meta name="description" content="Crie sua conta de cliente na PC Forge e compre peças de informática de lojas parceiras em todo o Brasil.">
</head>

<body data-tipo-pagina="cliente">
    <div id="topo-montagem" data-tipo="cliente" data-modo="cadastro"></div>

    <div class="tela">
        <section class="vitrine">
            <div class="vitrine-trajeto">
                <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M-50 460 Q 160 500 260 300 T 560 40" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 10" opacity="0.35"/>
                    <circle cx="260" cy="300" r="70" fill="var(--accent)" opacity="0.06"/>
                    <circle cx="500" cy="55" r="9" fill="var(--accent)" opacity="0.5"/>
                </svg>
            </div>
            <span class="vitrine-eyebrow">A forja do seu setup</span>
            <p class="vitrine-titulo">FORJE<br><em>SEU PC.</em></p>
            <p class="vitrine-texto">Processadores, GPUs, SSDs e periféricos de lojas parceiras em todo o Brasil. Crie sua conta e comece a forjar.</p>
        </section>

        <div class="pagina">
            <main>
                <h1>Criar conta</h1>
                <p class="subtitulo">Cadastre-se e forje o setup dos seus sonhos</p>

                <form id="form-cadastro">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>

                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>

                    <div class="row">
                        <div class="col">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="00000-000" maxlength="9"
                                onblur="pesquisarCep(this.value);" required>
                        </div>
                        <div class="col">
                            <label for="nascimento">Nascimento</label>
                            <input type="date" id="nascimento" required>
                        </div>
                    </div>

                    <label for="rua">Rua</label>
                    <input type="text" id="rua" required>

                    <div class="row">
                        <div class="col" style="flex: 1;">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" required>
                        </div>
                        <div class="col" style="flex: 2;">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col" style="flex: 2;">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" required>
                        </div>
                        <div class="col" style="flex: 1;">
                            <label for="uf">Estado</label>
                            <input type="text" id="uf" maxlength="2" placeholder="UF" required>
                        </div>
                    </div>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>

                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" placeholder="(00) 00000-0000" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" required>

                    <input type="submit" value="Criar minha conta">

                    <p id="mensagem-erro" class="mensagem-erro"></p>
                </form>
            </main>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/demo.js"></script>
    <script src="assets/js/admin-modal.js"></script>
    <script src="assets/js/carrinho-api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/cep.js"></script>
    <script src="assets/js/cliente-cadastro.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=2">
    <title>Entrar | PC Forge | Peças de TI</title>
    <meta name="description" content="Entre na sua conta de cliente da PC Forge com e-mail ou CPF e continue suas compras.">
</head>

<body data-tipo-pagina="cliente">
    <div id="topo-montagem" data-tipo="cliente" data-modo="login"></div>

    <div class="tela">
        <section class="vitrine">
            <div class="vitrine-trajeto" aria-hidden="true">
                <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M-50 460 Q 160 500 260 300 T 560 40" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 10" opacity="0.25"/>
                </svg>
            </div>


            <!-- terminal -->
            <div class="terminal-card" aria-hidden="true">
                <div class="terminal-barra"><span></span><span></span><span></span><em>pcforge://login</em></div>
                <div class="terminal-linhas">
                    <p class="linha" style="--linha: 1">&gt; status: <em>online</em>_</p>
                    <p class="linha" style="--linha: 2">&gt; banco de dados: <em>conectado</em>_</p>
                    <p class="linha" style="--linha: 3">&gt; pedidos na fila: <em>150</em>_</p>
                </div>
            </div>

            <p class="vitrine-titulo">ACESSE<br><em>A FORJA.</em></p>
            <p class="vitrine-texto">Entre na sua conta e continue de onde parou: seus pedidos e favoritos te esperam.</p>
        </section>

        <div class="pagina">
            <main class="compacto">
                <h1>Entrar</h1>
                <p class="subtitulo">Acesse e continue forjando seu setup</p>

                <form id="form-login">
                    <label for="identificador">E-mail ou CPF</label>
                    <input type="text" id="identificador" placeholder="exemplo@email.com" autocomplete="username" required>

                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" class="senha-olho" aria-label="Mostrar senha" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" width="18" height="18" aria-hidden="true">
                            <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                    </div>

                    <input type="submit" value="Entrar">

                    <p id="mensagem-erro" class="mensagem-erro"></p>
                </form>
            </main>
        </div>
    </div>

    <script src="assets/js/login-extras.js"></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/icones.js"></script>
    <script src="assets/js/demo.js"></script>
    <script src="assets/js/admin-modal.js"></script>
    <script src="assets/js/carrinho-api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/animacoes.js"></script>
</body>

</html>

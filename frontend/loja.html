<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/catalog.css">
    <link rel="stylesheet" href="assets/css/produto.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=2">
    <title>Loja | PC Forge — Peças e Acessórios de TI</title>
    <meta name="description" content="Página pública da loja parceira na PC Forge: produtos à venda, avaliações de clientes e informações da loja.">
    <script src="assets/js/acesso.js" data-exige="sessao"></script>
</head>

<!-- Página pública de uma loja: loja.html?id=3. Reaproveita o catálogo (produtos.js),
     que aqui filtra só os produtos dessa loja. -->
<body data-tipo-pagina="cliente" data-pagina="loja-publica">
    <div id="topo-montagem" data-tipo="cliente" data-modo="cadastro"></div>

    <main>
    <section class="loja-cabecalho" id="loja-cabecalho" aria-labelledby="loja-nome">
        <span class="vitrine-eyebrow">Loja parceira</span>
        <h1 id="loja-nome">Carregando loja...</h1>
        <p class="loja-descricao" id="loja-descricao"></p>
        <div class="loja-publica-meta" id="loja-meta"></div>
    </section>

    <div class="filtros" id="filtros"></div>

    <section class="secao-produtos" id="secao-produtos">
        <div class="grade-produtos" id="grade-produtos">
            <p class="estado-carregando">Carregando produtos...</p>
        </div>
    </section>

    <section class="produto-avaliacoes loja-avaliacoes" id="loja-avaliacoes" aria-labelledby="titulo-avaliacoes-loja">
        <h2 id="titulo-avaliacoes-loja">Avaliações da loja</h2>
        <div id="loja-avaliacoes-corpo">
            <p class="estado-carregando">Carregando avaliações...</p>
        </div>
    </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/demo.js"></script>
    <script src="assets/js/admin-modal.js"></script>
    <script src="assets/js/carrinho-api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/favoritos.js"></script>
    <script src="assets/js/produtos.js"></script>
    <script src="assets/js/loja-publica.js"></script>
</body>

</html>

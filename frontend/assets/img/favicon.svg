<!-- Favicon do PC Forge — v2 (Cyber-Lime): bigorna da forja sobre o
     gradiente limão, igual ao emblema da navbar (.marca-emblema). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="forja-lime" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#dbff7a"/>
            <stop offset="0.45" stop-color="#c6ff3d"/>
            <stop offset="1" stop-color="#a3e635"/>
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#forja-lime)"/>
    <!-- bigorna: mesmo path da logo (viewBox 24) centralizado no quadro -->
    <svg x="9" y="9" width="46" height="46" viewBox="0 0 24 24">
        <path d="M3 5h18c0 4-4 6-8 6v3h3a2 2 0 0 1 2 2v3H6v-3a2 2 0 0 1 2-2h3v-3C7 11 3 9 3 5z" fill="#1b1207"/>
    </svg>
</svg>
